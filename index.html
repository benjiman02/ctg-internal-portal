<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CTG Internal Finance Portal</title>
<meta name="robots" content="noindex">
<!-- The portal is sign-in only, so the front door is app.html rather than a landing page.
     This file exists so the bare site URL works, and so sign-out has somewhere to land;
     deleting it would 404 both.

     replace() rather than assign(), so Back from the sign-in screen doesn't bounce forward
     again and trap the user. Query string and hash are carried through. -->
<meta http-equiv="refresh" content="0;url=app.html">
<link rel="canonical" href="app.html">
<style>
  html{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F3F5F6;color:#4B5C68;
       font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:#1B6B63}
  @media (prefers-color-scheme:dark){ body{background:#12181E;color:#A7B7C0} a{color:#59BBAC} }
</style>
</head>
<body>
<script>
  location.replace('app.html' + (location.search || '') + (location.hash || ''));
</script>
<noscript><p>Continue to the <a href="app.html">CTG Internal Finance Portal</a>.</p></noscript>
</body>
</html>
