<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CTG Internal Finance Portal</title>
<meta name="robots" content="noindex">
<style>
  /* ── CTG brand ──────────────────────────────────────────────────────────────
     Three circles, three colours: sky blue, amber, vermilion — on warm off-white.
     Blue carries the interface (it is the calm one, and the mark's apex). Vermilion
     is reserved for action and for what is overdue, so a CTA and a problem never
     compete for the same attention. Amber warns. Green stays green because in
     finance a positive number must never be a brand decision. */
  :root{
    --ctg-blue:#2E7CB8;   --ctg-blue-lt:#4A9CD6;  --ctg-blue-soft:#E4F0F8;
    --ctg-amber:#D99400;  --ctg-amber-lt:#F2A900; --ctg-amber-soft:#FDF2DC;
    --ctg-verm:#E1451C;   --ctg-verm-lt:#F04E23;  --ctg-verm-soft:#FDEAE4;

    --paper:#F2F1EE; --raised:#FFFFFF; --sunken:#EAE8E4;
    --ink:#111214; --ink-soft:#4E5257; --ink-faint:#85898F;
    --rule:#DCD9D4; --rule-soft:#E9E6E1;
    --accent:var(--ctg-blue); --accent-strong:#1F5D8C; --accent-soft:var(--ctg-blue-soft);
    --cta:var(--ctg-verm); --cta-soft:var(--ctg-verm-soft);
    --good:#1F7A4C; --good-soft:#E2F2E9;
    --warn:var(--ctg-amber); --warn-soft:var(--ctg-amber-soft);
    --bad:var(--ctg-verm);   --bad-soft:var(--ctg-verm-soft);
    --mute:#85898F; --mute-soft:#E9E6E1;
    --shadow:0 1px 2px rgba(17,18,20,.05),0 6px 20px rgba(17,18,20,.05);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#131416; --raised:#1B1D20; --sunken:#0E0F11;
      --ink:#F2F1EE; --ink-soft:#AFB3B8; --ink-faint:#83878D;
      --rule:#2C2F33; --rule-soft:#232629;
      --accent:var(--ctg-blue-lt); --accent-strong:#7FBEE6; --accent-soft:#16303F;
      --cta:var(--ctg-verm-lt); --cta-soft:#3A1A11;
      --good:#4FBF85; --good-soft:#12301F;
      --warn:var(--ctg-amber-lt); --warn-soft:#33280C;
      --bad:#FF7551;  --bad-soft:#3A1A11;
      --mute:#8E9298; --mute-soft:#232629;
      --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --paper:#131416; --raised:#1B1D20; --sunken:#0E0F11;
    --ink:#F2F1EE; --ink-soft:#AFB3B8; --ink-faint:#83878D;
    --rule:#2C2F33; --rule-soft:#232629;
    --accent:var(--ctg-blue-lt); --accent-strong:#7FBEE6; --accent-soft:#16303F;
    --cta:var(--ctg-verm-lt); --cta-soft:#3A1A11;
    --good:#4FBF85; --good-soft:#12301F;
    --warn:var(--ctg-amber-lt); --warn-soft:#33280C;
    --bad:#FF7551;  --bad-soft:#3A1A11;
    --mute:#8E9298; --mute-soft:#232629;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font:15px/1.55 "Helvetica Neue",Helvetica,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
       -webkit-font-smoothing:antialiased}
  /* The brand sets everything in a bold geometric sans. Headings take the weight and
     tighten, which is what makes type read as CTG rather than as a default admin panel. */
  h1,h2,h3{font-weight:700;letter-spacing:-.02em}
  .mono,.num{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  .hide{display:none !important}

  /* The three-circle monogram, drawn rather than loaded so it is crisp at any size and
     costs no request. Blue apex, amber and vermilion below — the arrangement is the brand. */
  .mark{display:block}
  .mark circle,.mark line{fill:none;stroke-linecap:butt}

  /* Primary actions stay brand blue: calm, and the mark's apex colour. Vermilion is held
     back for what is overdue or destructive, so the boldest colour in the palette always
     means "look at this", never merely "continue". */
  button{font:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  h2{font-size:21px;margin:0 0 4px}
  .sub{color:var(--ink-soft);font-size:14px;margin:0 0 18px}

  /* ── sign in ── */
  #signin{min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{background:var(--raised);border:1px solid var(--rule);border-radius:14px;padding:32px;
        width:100%;max-width:400px;box-shadow:var(--shadow)}
  .brand{font-size:13.5px;letter-spacing:.02em;color:var(--ink);font-weight:700;margin-bottom:8px}
  .card h1{font-size:21px;margin:0 0 22px;line-height:1.25}
  label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 6px}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:8px;
        background:var(--paper);color:var(--ink);font:inherit}
  #signin input{margin-bottom:16px}
  .btn{padding:10px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;transition:opacity .15s}
  .btn:hover{opacity:.9}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-block{width:100%}
  .btn-sm{padding:6px 12px;font-size:13px;border-radius:6px}
  .btn-ghost{background:transparent;color:var(--accent-strong);border:1px solid var(--rule)}
  .btn-danger{background:var(--bad)}
  .msg{font-size:13.5px;padding:10px 12px;border-radius:8px;margin-bottom:16px}
  .msg.err{background:var(--bad-soft);color:var(--bad)}
  .msg.ok{background:var(--good-soft);color:var(--good)}
  .msg.warn{background:var(--warn-soft);color:var(--warn)}
  .hint{font-size:13px;color:var(--ink-faint);margin:0 0 16px}

  /* ── shell ── */
  header{border-bottom:1px solid var(--rule);background:var(--raised);position:sticky;top:0;z-index:20}
  .bar{max-width:1240px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:14px}
  .bar .name{font-weight:700;font-size:14.5px;white-space:nowrap}
  .bar .spacer{flex:1}
  .bar .who{font-size:12.5px;color:var(--ink-faint);white-space:nowrap}
  .bar select{width:auto;min-width:170px;padding:6px 10px;font-size:13.5px}
  nav.tabs{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
  nav.tabs button{background:none;border:none;padding:10px 14px;font-size:14px;color:var(--ink-faint);
                  border-bottom:2px solid transparent;white-space:nowrap}
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button.on{color:var(--ink);border-bottom-color:var(--ctg-verm-lt);font-weight:700}
  main{max-width:1240px;margin:0 auto;padding:26px 20px 90px}

  /* ── generic surfaces ── */
  .panel{background:var(--raised);border:1px solid var(--rule);border-radius:12px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  .empty{color:var(--ink-faint);font-size:14px;padding:10px 0}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grow{flex:1}

  /* ── stat tiles ── */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
  .tile{background:var(--raised);border:1px solid var(--rule);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow)}
  .tile .k{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:6px}
  .tile .v{font-size:22px;font-weight:700;letter-spacing:-.01em}
  .tile .m{font-size:12px;color:var(--ink-faint);margin-top:3px}
  .tile.accent .v{color:var(--accent-strong)}
  /* A hairline of brand colour along the top of each tile, cycling the three hues so a
     row of figures carries the mark's palette without shouting. */
  .tiles .tile:nth-child(3n+1){border-top:3px solid var(--ctg-blue-lt)}
  .tiles .tile:nth-child(3n+2){border-top:3px solid var(--ctg-amber-lt)}
  .tiles .tile:nth-child(3n+3){border-top:3px solid var(--ctg-verm-lt)}

  /* ── tables ── */
  .tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:12px;background:var(--raised);box-shadow:var(--shadow)}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);
     font-weight:600;padding:10px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--raised);
     position:sticky;top:0}
  td{padding:9px 12px;border-bottom:1px solid var(--rule-soft);vertical-align:middle;color:var(--ink-soft);white-space:nowrap}
  tr:last-child td{border-bottom:none}
  td.name{color:var(--ink);font-weight:600;white-space:normal;min-width:150px}
  td.num,th.num{text-align:right;font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
  td.num{color:var(--ink)}
  tfoot td{border-top:2px solid var(--rule);border-bottom:none;font-weight:700;color:var(--ink);background:var(--sunken)}
  tr.warn-row td{background:var(--warn-soft)}

  /* ── pills ── */
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;
        border-radius:20px;font-family:ui-monospace,Menlo,monospace;white-space:nowrap}
  .pill.good{background:var(--good-soft);color:var(--good)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.mute{background:var(--mute-soft);color:var(--mute)}
  .pill.bad{background:var(--bad-soft);color:var(--bad)}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

  /* ── company cards ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .co{background:var(--raised);border:1px solid var(--rule);border-radius:12px;padding:17px;box-shadow:var(--shadow)}
  .co .cn{font-weight:700;font-size:14.5px;margin-bottom:2px}
  .co .cl{font-size:12px;color:var(--ink-faint);margin-bottom:11px}
  .feats{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px;padding-top:11px;border-top:1px solid var(--rule-soft)}
  .feat{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--mute-soft);color:var(--ink-faint)}
  .feat.on{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}

  /* ── modal ── */
  .modal-bg{position:fixed;inset:0;background:rgba(10,16,22,.55);display:grid;place-items:center;padding:20px;z-index:50}
  .modal{background:var(--raised);border:1px solid var(--rule);border-radius:14px;padding:24px;
         width:100%;max-width:680px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal h3{margin:0 0 16px;font-size:17px}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
  @media(max-width:560px){.fields{grid-template-columns:1fr}}
  .fields .full{grid-column:1/-1}
  .fields label{margin-bottom:4px}
  .fld-note{font-size:11.5px;color:var(--ink-faint);margin-top:3px;font-weight:400}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--rule-soft)}
  .check{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft)}
  .check input{width:auto;margin:0}

  .link{background:none;border:none;color:var(--accent-strong);padding:0;font-size:13.5px;text-decoration:underline}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
         padding:11px 20px;border-radius:10px;font-size:14px;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  @media(max-width:600px){main{padding:20px 14px 70px}.bar{padding:10px 14px}nav.tabs{padding:0 14px}}
</style>
</head>
<body>

<!-- ═══════════ sign in ═══════════ -->
<div id="signin">
  <div class="card">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <svg class="mark" width="48" height="48" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="24" r="16" stroke="var(--ctg-blue-lt)" stroke-width="7"/>
        <circle cx="26" cy="68" r="16" stroke="var(--ctg-amber-lt)" stroke-width="7"/>
        <line x1="26" y1="49" x2="26" y2="87" stroke="var(--ctg-amber-lt)" stroke-width="7"/>
        <circle cx="74" cy="68" r="16" stroke="var(--ctg-verm-lt)" stroke-width="7"/>
        <line x1="74" y1="68" x2="94" y2="68" stroke="var(--ctg-verm-lt)" stroke-width="7"/>
      </svg>
      <div>
        <div class="brand" style="margin:0">CTG Internal</div>
        <div style="font-size:11.5px;color:var(--ink-faint);letter-spacing:.04em">CARE THROUGH GOODS</div>
      </div>
    </div>
    <h1 id="signinTitle">Sign in to the finance portal</h1>
    <div id="signinMsg" class="msg err hide"></div>

    <form id="pwForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="btn btn-block" type="submit" id="pwBtn">Sign in</button>
    </form>

    <form id="twoFaForm" class="hide">
      <p class="hint">Enter the 6-digit code from your authenticator app.</p>
      <label for="code">Authentication code</label>
      <input id="code" class="mono" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
      <button class="btn btn-block" type="submit" id="twoFaBtn">Verify</button>
    </form>

    <form id="setupForm" class="hide">
      <p class="hint">This portal has no accounts yet. Create the first administrator — choose your own password; nobody else ever sees it.</p>
      <label for="suName">Your name</label>
      <input id="suName" type="text" autocomplete="name" required>
      <label for="suEmail">Email</label>
      <input id="suEmail" type="email" autocomplete="username" required>
      <label for="suPassword">Password <span style="font-weight:400;color:var(--ink-faint)">— at least 12 characters</span></label>
      <input id="suPassword" type="password" autocomplete="new-password" minlength="12" required>
      <label for="suKey">Setup key</label>
      <input id="suKey" class="mono" type="text" required>
      <button class="btn btn-block" type="submit" id="suBtn">Create administrator</button>
    </form>
  </div>
</div>

<!-- ═══════════ app ═══════════ -->
<div id="app" class="hide">
  <header>
    <div class="bar">
      <svg class="mark" width="28" height="28" viewBox="0 0 100 100" aria-hidden="true" style="flex-shrink:0">
        <circle cx="50" cy="24" r="16" stroke="var(--ctg-blue-lt)" stroke-width="8"/>
        <circle cx="26" cy="68" r="16" stroke="var(--ctg-amber-lt)" stroke-width="8"/>
        <line x1="26" y1="49" x2="26" y2="87" stroke="var(--ctg-amber-lt)" stroke-width="8"/>
        <circle cx="74" cy="68" r="16" stroke="var(--ctg-verm-lt)" stroke-width="8"/>
        <line x1="74" y1="68" x2="94" y2="68" stroke="var(--ctg-verm-lt)" stroke-width="8"/>
      </svg>
      <span class="name">CTG Internal Finance</span>
      <select id="companySel" title="Active company"></select>
      <span class="spacer"></span>
      <span class="who" id="who"></span>
      <button class="btn btn-sm btn-ghost" id="signOutBtn">Sign out</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="view"></main>
</div>

<script src="./shared/config.js"></script>
<script src="./shared/api.js"></script>
<script src="./shared/auth.js"></script>
<script>
(function(){
  const API = window.CTG_API, AUTH = window.CTG_AUTH;
  const $ = (id) => document.getElementById(id);
  const esc = (x) => (x == null ? "" : String(x)).replace(/[&<>"']/g,
    (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // Money crosses the wire as integer sen and is only ever turned into ringgit for display.
  const rm  = (sen) => "RM " + (Number(sen||0)/100).toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});
  const rm0 = (sen) => "RM " + Math.round(Number(sen||0)/100).toLocaleString("en-MY");
  const senFromInput = (v) => Math.round((parseFloat(String(v).replace(/[^0-9.\-]/g,"")) || 0) * 100);
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  let ME=null, PERMS=null, COMPANIES=[], ACTIVE=null, TAB="overview";

  function toast(text){
    const el=document.createElement("div"); el.className="toast"; el.textContent=text;
    document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
  }

  // ═══════════ sign in ═══════════
  function showSignIn(message){
    $("app").classList.add("hide"); $("signin").classList.remove("hide");
    if (message) showMsg(message);
  }
  function showMsg(text, kind){
    const el=$("signinMsg"); el.textContent=text; el.className="msg "+(kind||"err"); el.classList.remove("hide");
  }
  const clearMsg = () => $("signinMsg").classList.add("hide");

  $("pwForm").addEventListener("submit", async (e)=>{
    e.preventDefault(); clearMsg();
    const btn=$("pwBtn"); btn.disabled=true; btn.textContent="Signing in…";
    const res = await AUTH.signIn($("email").value.trim(), $("password").value);
    btn.disabled=false; btn.textContent="Sign in";
    if (res.status==="error") return showMsg(res.message);
    if (res.status==="2fa"){
      $("pwForm").classList.add("hide"); $("twoFaForm").classList.remove("hide");
      $("signinTitle").textContent="Two-factor authentication"; $("code").focus(); return;
    }
    await enterApp();
  });

  $("twoFaForm").addEventListener("submit", async (e)=>{
    e.preventDefault(); clearMsg();
    const btn=$("twoFaBtn"); btn.disabled=true; btn.textContent="Verifying…";
    const res = await AUTH.submitTwoFactor($("code").value.trim());
    btn.disabled=false; btn.textContent="Verify";
    if (res.status==="error"){ $("code").value=""; return showMsg(res.message); }
    await enterApp();
  });

  $("setupForm").addEventListener("submit", async (e)=>{
    e.preventDefault(); clearMsg();
    const btn=$("suBtn"); btn.disabled=true; btn.textContent="Creating…";
    const res = await API.call("bootstrap_admin", {
      setup_key:$("suKey").value.trim(), email:$("suEmail").value.trim(),
      name:$("suName").value.trim(), password:$("suPassword").value, token:undefined,
    });
    btn.disabled=false; btn.textContent="Create administrator";
    if (!res || res.ok!==true) return showMsg(AUTH.friendlyError(res && res.error));
    const signedIn = await AUTH.signIn($("suEmail").value.trim(), $("suPassword").value);
    if (signedIn.status!=="ok"){
      $("setupForm").classList.add("hide"); $("pwForm").classList.remove("hide");
      return showMsg("Administrator created. Sign in to continue.","ok");
    }
    await enterApp();
  });

  $("signOutBtn").addEventListener("click", async ()=>{ await AUTH.signOut(); location.reload(); });

  // ═══════════ shell ═══════════
  const TABS = [
    { key:"overview", label:"Overview" },
    { key:"payroll",  label:"Payroll",   feature:"payroll" },
    { key:"people",   label:"Employees", feature:"payroll" },
    { key:"o2o",      label:"O2O Invoicing", feature:"o2o" },
    { key:"gateway",  label:"Gateway Fees", feature:"gateway_fees" },
    { key:"ap",       label:"Supplier Invoices", feature:"ap" },
    { key:"settings", label:"Settings" },
  ];

  async function enterApp(){
    ME = await AUTH.currentUser();
    if (!ME) return showSignIn("Your session has expired. Sign in again.");
    PERMS = await AUTH.permissions();
    $("signin").classList.add("hide"); $("app").classList.remove("hide");
    $("who").textContent = ME.name + " · " + (PERMS ? PERMS.label : ME.role) +
      (PERMS && PERMS.read_only ? " · view only" : "");

    const res = await API.call("companies_list");
    COMPANIES = (res && res.ok) ? res.companies : [];
    const saved = (function(){ try { return localStorage.getItem("ctg_active_company"); } catch(_e){ return null; } })();
    ACTIVE = COMPANIES.find((c)=>c.id===saved) || COMPANIES[0] || null;

    $("companySel").innerHTML = COMPANIES.map((c)=>
      '<option value="'+esc(c.id)+'"'+(ACTIVE&&c.id===ACTIVE.id?" selected":"")+">"+esc(c.short_name)+"</option>").join("");
    $("companySel").onchange = (e)=>{
      ACTIVE = COMPANIES.find((c)=>c.id===e.target.value) || null;
      try { localStorage.setItem("ctg_active_company", ACTIVE ? ACTIVE.id : ""); } catch(_e){}
      render();
    };

    renderTabs(); render();
  }

  // Permission helpers. Every one asks what the server said this person may do, never what
  // their role is called — renaming the top role once left it seeing nothing at all.
  function feat(name){ return !!(PERMS && PERMS.features && PERMS.features.indexOf(name)>=0); }
  function canWrite(){ return !!(PERMS && !PERMS.read_only); }
  function canManageUsers(){ return !!(PERMS && PERMS.manage_users); }

  function visibleTabs(){
    return TABS.filter(function(t){ return !t.feature || feat(t.feature); });
  }

  function renderTabs(){
    $("tabs").innerHTML = visibleTabs().map((t)=>
      '<button data-tab="'+t.key+'" class="'+(t.key===TAB?"on":"")+'">'+esc(t.label)+"</button>").join("");
    $("tabs").querySelectorAll("button").forEach((b)=>{
      b.onclick = ()=>{ TAB=b.dataset.tab; renderTabs(); render(); };
    });
  }

  function render(){
    const v=$("view");
    if (!visibleTabs().some((t)=>t.key===TAB)) TAB = "overview";
    if (TAB==="overview") return renderOverview(v);

  async function loadDashboard(){
    const box=$("dashBody"); if(!box) return;
    box.innerHTML='<p class="empty">Reading live figures from Xero…</p>';
    const params = DASH_SCOPE==="group" ? {} : { company_id: DASH_SCOPE };
    const res = await API.call("dashboard", params);
    if(!res.ok){ box.innerHTML='<p class="empty">'+esc(AUTH.friendlyError(res.error))+"</p>"; return; }

    const asAtEl=$("dashAsAt");
    if(asAtEl) asAtEl.textContent = "Live from Xero · as at "+fmtDateTime(res.as_at);

    if(!res.companies.length){ box.innerHTML='<p class="empty">No companies available to your account.</p>'; return; }

    const g=res.group;
    let html="";

    // Anything that failed is stated up front. A dashboard that silently drops a company
    // reads as "we are owed less than we are", which is the worst possible way to be wrong.
    if(g.errors && g.errors.length){
      html+='<div class="msg warn" style="margin-bottom:16px"><strong>Some figures could not be read:</strong><ul style="margin:8px 0 0;padding-left:20px">'+
        g.errors.map((e)=>"<li>"+esc(e.company)+" — "+esc(e.error)+"</li>").join("")+
        "</ul>Totals below exclude these companies.</div>";
    }
    const noBank = res.companies.filter((c)=>c.connected && !c.bank_available);
    if(noBank.length){
      html+='<div class="msg warn" style="margin-bottom:16px"><strong>Bank balances not available for '+
        noBank.map((c)=>esc(c.short_name)).join(", ")+".</strong> "+esc(noBank[0].bank_reason||"")+
        ". Net position below therefore excludes cash for these companies — it is not zero, it is unknown.</div>";
    }
    const notConnected = res.companies.filter((c)=>!c.connected);
    if(notConnected.length){
      html+='<div class="msg warn" style="margin-bottom:16px">Not yet connected to Xero, so contributing nothing to these totals: '+
        notConnected.map((c)=>esc(c.short_name)).join(", ")+"</div>";
    }

    html+='<div class="tiles">'+
      tile("Owed to us", rm0(g.receivables_sen), "outstanding receivables", true)+
      tile("We owe", rm0(g.payables_sen), "outstanding payables")+
      (g.bank_complete
        ? tile("In the bank", rm0(g.bank_sen), "across all accounts")
        : tile("In the bank", g.bank_available_for ? rm0(g.bank_sen) : "not available",
               g.bank_available_for ? g.bank_available_for+" of "+g.companies_connected+" companies" : "Xero permission needed"))+
      tile("Net position", rm0(g.net_position_sen),
           g.bank_complete ? "receivables + bank − payables" : "receivables − payables (bank not included)", true)+
      tile("Overdue to us", rm0(g.overdue_receivables_sen), pctOf(g.overdue_receivables_sen,g.receivables_sen)+" of receivables")+
      "</div>";

    html+='<div class="panel"><h2 style="font-size:16px">Who owes us — ageing</h2>'+
      '<p class="sub">Outstanding customer invoices by how far past due they are.</p>'+
      ageingBar(res.buckets, g.ar_ageing, g.receivables_sen)+"</div>";

    html+='<div class="panel"><h2 style="font-size:16px">What we owe — ageing</h2>'+
      '<p class="sub">Outstanding supplier bills by how far past due they are.</p>'+
      ageingBar(res.buckets, g.ap_ageing, g.payables_sen)+"</div>";

    // Per-company breakdown, always shown so the group total can be traced to its parts.
    html+='<h2 style="font-size:16px;margin:24px 0 4px">By company</h2>'+
      '<p class="sub">Every figure above, split by entity.</p>'+
      '<div class="tbl-wrap"><table><thead><tr><th>Company</th><th class="num">Owed to us</th>'+
      '<th class="num">Overdue</th><th class="num">We owe</th><th class="num">Bank</th>'+
      '<th class="num">Net</th><th class="num">Open invoices</th></tr></thead><tbody>'+
      res.companies.map((c)=>{
        const net=c.receivables_sen+(c.bank_sen||0)-c.payables_sen;
        return "<tr>"+
          "<td class='name'>"+esc(c.short_name)+
            (!c.connected?' <span class="pill warn">no Xero</span>':"")+
            (c.error?' <span class="pill bad">error</span>':"")+"</td>"+
          "<td class='num'>"+rm(c.receivables_sen)+"</td>"+
          "<td class='num'>"+(c.overdue_receivables_sen?'<span style="color:var(--bad)">'+rm(c.overdue_receivables_sen)+"</span>":"—")+"</td>"+
          "<td class='num'>"+rm(c.payables_sen)+"</td>"+
          "<td class='num'>"+(c.bank_available ? rm(c.bank_sen) : '<span style="color:var(--ink-faint)" title="'+esc(c.bank_reason||"")+'">n/a</span>')+"</td>"+
          "<td class='num'><strong>"+rm(net)+"</strong></td>"+
          "<td class='num'>"+(c.invoice_counts.ar_open+c.invoice_counts.ap_open)+"</td>"+
        "</tr>";
      }).join("")+
      "</tbody><tfoot><tr><td>Group</td>"+
      "<td class='num'>"+rm(g.receivables_sen)+"</td>"+
      "<td class='num'>"+rm(g.overdue_receivables_sen)+"</td>"+
      "<td class='num'>"+rm(g.payables_sen)+"</td>"+
      "<td class='num'>"+rm(g.bank_sen)+"</td>"+
      "<td class='num'>"+rm(g.net_position_sen)+"</td>"+
      "<td class='num'></td></tr></tfoot></table></div>";

    // Debtors and creditors, merged across whatever scope is selected.
    const debtors=mergeParties(res.companies,"top_debtors");
    const creditors=mergeParties(res.companies,"top_creditors");
    html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px" id="partyCols">'+
      partyTable("Largest debtors","Who owes us the most",debtors,"owed")+
      partyTable("Largest creditors","Who we owe the most",creditors,"owing")+
      "</div>";

    box.innerHTML=html;
    if (window.matchMedia("(max-width:760px)").matches){
      const pc=$("partyCols"); if(pc) pc.style.gridTemplateColumns="1fr";
    }
  }

  function pctOf(part,whole){
    if(!whole) return "none outstanding";
    return Math.round((part/whole)*100)+"%";
  }

  function ageingBar(buckets, ageing, total){
    if(!total) return '<p class="empty">Nothing outstanding.</p>';
    const colors=["var(--good)","var(--accent)","var(--warn)","var(--copper,#A85D25)","var(--bad)"];
    let bar='<div style="display:flex;height:12px;border-radius:6px;overflow:hidden;margin-bottom:14px;background:var(--mute-soft)">';
    buckets.forEach((b,i)=>{
      const v=ageing[b.key]||0;
      if(v>0) bar+='<div title="'+esc(b.label)+'" style="width:'+((v/total)*100)+'%;background:'+colors[i%colors.length]+'"></div>';
    });
    bar+="</div>";
    bar+='<div class="tbl-wrap" style="box-shadow:none"><table><thead><tr>'+
      buckets.map((b)=>'<th class="num">'+esc(b.label)+"</th>").join("")+"</tr></thead><tbody><tr>"+
      buckets.map((b)=>{
        const v=ageing[b.key]||0;
        const overdue=b.key!=="current"&&v>0;
        return "<td class='num'"+(overdue?" style='color:var(--bad);font-weight:600'":"")+">"+(v?rm(v):"—")+"</td>";
      }).join("")+"</tr></tbody></table></div>";
    return bar;
  }

  function mergeParties(companies, key){
    const m=new Map();
    for(const c of companies){
      for(const p of (c[key]||[])){
        const cur=m.get(p.name)||{amount_sen:0,oldest_days:0,companies:new Set()};
        cur.amount_sen+=p.amount_sen;
        cur.oldest_days=Math.max(cur.oldest_days,p.oldest_days);
        cur.companies.add(c.short_name);
        m.set(p.name,cur);
      }
    }
    return [...m.entries()].map(([name,v])=>({name,...v,companies:[...v.companies]}))
      .sort((a,b)=>b.amount_sen-a.amount_sen).slice(0,10);
  }

  function partyTable(title, subtitle, rows, kind){
    if(!rows.length){
      return '<div class="panel" style="margin:0"><h2 style="font-size:16px">'+esc(title)+"</h2>"+
             '<p class="sub">'+esc(subtitle)+'</p><p class="empty">Nothing outstanding.</p></div>';
    }
    return '<div class="panel" style="margin:0"><h2 style="font-size:16px">'+esc(title)+"</h2>"+
      '<p class="sub">'+esc(subtitle)+"</p>"+
      '<div class="tbl-wrap" style="box-shadow:none"><table><thead><tr><th>Name</th>'+
      '<th class="num">Amount</th><th class="num">Oldest</th></tr></thead><tbody>'+
      rows.map((r)=>"<tr><td class='name'>"+esc(r.name)+
        (r.companies.length>1?'<div style="font-size:11px;color:var(--ink-faint);font-weight:400">'+esc(r.companies.join(", "))+"</div>":"")+
        "</td><td class='num'>"+rm(r.amount_sen)+"</td>"+
        "<td class='num'>"+(r.oldest_days>0
          ? '<span style="color:var(--bad)">'+r.oldest_days+"d</span>"
          : '<span class="pill good">current</span>')+"</td></tr>").join("")+
      "</tbody></table></div></div>";
  }

  function fmtDateTime(iso){
    try {
      return new Date(iso).toLocaleString("en-MY",
        {day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
    } catch(_e){ return iso; }
  }

  async function loadPayroll(){
    const box=$("prBody"); if(!box) return;
    box.innerHTML='<p class="empty">Loading…</p>';
    const res = await API.call("hr_payroll_run_get", { company_id:ACTIVE.id, year:PR_YEAR, month:PR_MONTH });
    if (!res.ok){ box.innerHTML='<p class="empty">'+esc(AUTH.friendlyError(res.error))+"</p>"; return; }
    if (!res.rows.length){
      box.innerHTML='<div class="panel"><p class="empty">No active employees in this company. Add employees before running payroll.</p></div>'; return;
    }

    const finalised = res.status==="finalised";
    const t=res.totals;
    const allWarnings = res.rows.flatMap((r)=>r.warnings||[]);

    let html = '<div class="tiles">'+
      tile("Headcount", String(t.headcount), "", true)+
      tile("Gross pay", rm0(t.gross_sen), "before deductions")+
      tile("Net pay", rm0(t.net_sen), "to bank accounts", true)+
      tile("Statutory (employee)", rm0(t.epf_ee_sen+t.socso_ee_sen+t.eis_ee_sen+t.skbbk_sen+t.pcb_sen), "EPF, SOCSO, EIS, PCB")+
      tile("Employer cost", rm0(t.employer_cost_sen), "gross + employer contributions")+
      "</div>";

    html += '<div class="panel" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
      (finalised
        ? '<span class="pill good"><span class="dot"></span>Finalised</span><span class="sub" style="margin:0">'+
          MONTHS[PR_MONTH-1]+" "+PR_YEAR+" is locked. Payslip figures below are the stored record.</span>"+
          '<span class="grow"></span>'+(canManageUsers()?'<button class="btn btn-sm btn-ghost" id="reopenBtn">Reopen</button>':"")
        : '<span class="pill warn"><span class="dot"></span>Draft</span><span class="sub" style="margin:0">'+
          "Edit any row, then finalise to lock the month and issue payslips.</span>"+
          '<span class="grow"></span><button class="btn btn-sm" id="finaliseBtn">Finalise '+MONTHS[PR_MONTH-1]+"</button>")+
      "</div>";

    if (allWarnings.length){
      const uniq=[...new Set(allWarnings)];
      html += '<div class="msg warn" style="margin-bottom:18px"><strong>'+uniq.length+
        " point"+(uniq.length===1?"":"s")+" to check before finalising:</strong><ul style='margin:8px 0 0;padding-left:20px'>"+
        uniq.map((w)=>"<li>"+esc(w)+"</li>").join("")+"</ul></div>";
    }

    html += '<div class="tbl-wrap"><table><thead><tr>'+
      "<th>No.</th><th>Name</th><th class='num'>Basic</th><th class='num'>Additions</th>"+
      "<th class='num'>Gross</th><th class='num'>EPF</th><th class='num'>SOCSO</th><th class='num'>EIS</th>"+
      "<th class='num'>SKBBK</th><th class='num'>PCB</th><th class='num'>Net</th>"+(finalised?"":"<th></th>")+
      "</tr></thead><tbody>"+
      res.rows.map((r)=>{
        const c=r.computed, adds=(r.adjustments||[]).filter((a)=>a.kind!=="deduction"&&a.kind!=="unpaid_leave")
          .reduce((s,a)=>s+Number(a.amount_sen||0),0);
        return "<tr"+(r.warnings&&r.warnings.length?" class='warn-row'":"")+">"+
          "<td class='mono'>"+esc(r.employee.emp_no||"")+"</td>"+
          "<td class='name'>"+esc(r.employee.name)+"</td>"+
          "<td class='num'>"+rm(r.employee.basic_salary_sen||0)+"</td>"+
          "<td class='num'>"+(adds?rm(adds):"—")+"</td>"+
          "<td class='num'>"+rm(c.gross_sen)+"</td>"+
          "<td class='num'>"+rm(c.epf_ee_sen)+"</td>"+
          "<td class='num'>"+rm(c.socso_ee_sen)+"</td>"+
          "<td class='num'>"+rm(c.eis_ee_sen)+"</td>"+
          "<td class='num'>"+rm(c.skbbk_sen||0)+"</td>"+
          "<td class='num'>"+rm(c.pcb_sen)+"</td>"+
          "<td class='num'><strong>"+rm(c.net_sen)+"</strong></td>"+
          (finalised?"":"<td><button class='link' data-emp='"+esc(r.employee.id)+"'>Edit</button></td>")+
        "</tr>";
      }).join("")+
      "</tbody><tfoot><tr><td colspan='4'>Total — "+t.headcount+" employees</td>"+
      "<td class='num'>"+rm(t.gross_sen)+"</td><td class='num'>"+rm(t.epf_ee_sen)+"</td>"+
      "<td class='num'>"+rm(t.socso_ee_sen)+"</td><td class='num'>"+rm(t.eis_ee_sen)+"</td>"+
      "<td class='num'>"+rm(t.skbbk_sen)+"</td><td class='num'>"+rm(t.pcb_sen)+"</td>"+
      "<td class='num'>"+rm(t.net_sen)+"</td>"+(finalised?"":"<td></td>")+"</tr></tfoot></table></div>";

    box.innerHTML = html;

    const fb=$("finaliseBtn");
    if (fb) fb.onclick = ()=>confirmFinalise(res.totals);
    const rb=$("reopenBtn");
    if (rb) rb.onclick = ()=>confirmReopen();
    box.querySelectorAll("button.link[data-emp]").forEach((b)=>{
      b.onclick = ()=>adjustmentsModal(res.rows.find((r)=>r.employee.id===b.dataset.emp));
    });
  }

  function tile(k,v,m,accent){
    return '<div class="tile'+(accent?" accent":"")+'"><div class="k">'+esc(k)+'</div><div class="v num">'+esc(v)+"</div>"+
           (m?'<div class="m">'+esc(m)+"</div>":"")+"</div>";

  function adjustmentsModal(row){
    const kinds=[["bonus","Bonus"],["overtime","Overtime"],["allowance","Other allowance"],
                 ["deduction","Deduction"],["unpaid_leave","Unpaid leave"],["basic_override","Basic salary override"]];
    const cur={}; (row.adjustments||[]).forEach((a)=>{ cur[a.kind]=(cur[a.kind]||0)+Number(a.amount_sen||0); });

    bg.innerHTML='<div class="modal" style="max-width:460px"><h3>'+esc(row.employee.name)+" — "+MONTHS[PR_MONTH-1]+" "+PR_YEAR+"</h3>"+
      '<div id="adjMsg" class="msg err hide"></div>'+
      kinds.map(([k,label])=>
        '<div style="margin-bottom:12px"><label>'+label+' (RM)</label>'+
        '<input class="mono adj" data-kind="'+k+'" inputmode="decimal" value="'+(cur[k]?(cur[k]/100).toFixed(2):"")+'">'+
        (k==="basic_override"?'<div class="fld-note">Replaces the contract salary for this month only.</div>':"")+
        (k==="unpaid_leave"?'<div class="fld-note">Reduces gross pay, and therefore every statutory contribution.</div>':"")+
        "</div>").join("")+
      '<div class="modal-actions"><button class="btn btn-sm btn-ghost" id="adjCancel">Cancel</button>'+
      '<button class="btn btn-sm" id="adjSave">Save</button></div></div>';

    bg.querySelector("#adjSave").onclick=async ()=>{
      const btn=bg.querySelector("#adjSave"); btn.disabled=true; btn.textContent="Saving…";
      const adjustments=[...bg.querySelectorAll("input.adj")].map((i)=>({
        kind:i.dataset.kind, amount_sen:senFromInput(i.value),
      })).filter((a)=>a.amount_sen>0);

  // ═══════════ O2O pharmacy invoicing ═══════════
  let O2O_BATCH = null;

  async function renderO2O(v){
    if (!ACTIVE) { v.innerHTML='<p class="empty">Select a company first.</p>'; return; }
    if (O2O_BATCH) return renderO2OBatch(v, O2O_BATCH);

    v.innerHTML =
      '<div class="row" style="margin-bottom:16px"><div class="grow">'+
      '<h2>O2O invoicing</h2><p class="sub" style="margin:0">'+esc(ACTIVE.short_name)+
      ' — import a month of pharmacy sales, then raise one invoice per pharmacy.</p></div>'+
      '<button class="btn btn-sm" id="newBatch">Import sales file</button></div>'+
      '<div id="batchList"><p class="empty">Loading…</p></div>';
    $("newBatch").onclick = importModal;

    const res = await API.call("o2o_batches_list", { company_id: ACTIVE.id });
    const box=$("batchList");
    if(!res.ok){ box.innerHTML='<p class="empty">'+esc(AUTH.friendlyError(res.error))+'</p>'; return; }
    if(!res.batches.length){
      box.innerHTML='<div class="panel"><p class="empty">No sales files imported yet. '+
        'Export your pharmacy sales as CSV and import it to get started.</p></div>'; return;
    }
    box.innerHTML='<div class="tbl-wrap"><table><thead><tr><th>Period</th><th>File</th>'+
      '<th>Status</th><th>Imported</th><th></th></tr></thead><tbody>'+
      res.batches.map(function(b){
        var pill = b.status==="issued" ? '<span class="pill good">issued</span>'
                 : b.status==="cancelled" ? '<span class="pill mute">cancelled</span>'
                 : '<span class="pill warn">draft</span>';
        return "<tr><td class='name'>"+esc(MONTHS[b.period_month-1])+" "+esc(b.period_year)+"</td>"+
          "<td>"+esc(b.source_name||"—")+"</td><td>"+pill+"</td>"+
          "<td>"+esc(fmtDate(b.created_at))+"</td>"+
          "<td><button class='link' data-b='"+esc(b.id)+"'>Open</button></td></tr>";
      }).join("")+"</tbody></table></div>";
    box.querySelectorAll("button.link").forEach(function(btn){
      btn.onclick=function(){ O2O_BATCH=btn.dataset.b; render(); };
    });
  }

  function importModal(){
    var now=new Date();
    var years=[]; for(var y=now.getFullYear()+1;y>=now.getFullYear()-2;y--) years.push(y);
    var bg=document.createElement("div"); bg.className="modal-bg";
    bg.innerHTML='<div class="modal" style="max-width:540px"><h3>Import pharmacy sales</h3>'+
      '<div id="impMsg" class="msg err hide"></div>'+
      '<p class="sub">A CSV with one row per sale. It needs a pharmacy column and an amount column; '+
      'date, item code, description and quantity are used when present. Column names are matched loosely.</p>'+
      '<div class="fields">'+
        '<div><label>Month</label><select id="i_month">'+MONTHS.map(function(m,i){
          return '<option value="'+(i+1)+'"'+(i+1===now.getMonth()+1?" selected":"")+">"+m+"</option>"; }).join("")+"</select></div>"+
        '<div><label>Year</label><select id="i_year">'+years.map(function(y){
          return '<option'+(y===now.getFullYear()?" selected":"")+">"+y+"</option>"; }).join("")+"</select></div>"+
        '<div class="full"><label>Revenue account code in Xero</label>'+
          '<input id="i_acct" placeholder="e.g. 200"><div class="fld-note">Left blank, Xero uses the account on each contact or its default.</div></div>'+
        '<div class="full"><label>CSV file</label><input type="file" id="i_file" accept=".csv,text/csv"></div>'+
      "</div>"+
      '<div class="modal-actions"><button class="btn btn-sm btn-ghost" id="impCancel">Cancel</button>'+
      '<button class="btn btn-sm" id="impGo">Import</button></div></div>';
    document.body.appendChild(bg);
    bg.addEventListener("click",function(ev){ if(ev.target===bg) bg.remove(); });
    bg.querySelector("#impCancel").onclick=function(){ bg.remove(); };
    bg.querySelector("#impGo").onclick=function(){
      var f=bg.querySelector("#i_file").files[0];
      var m=bg.querySelector("#impMsg");
      if(!f){ m.textContent="Choose a CSV file first."; m.classList.remove("hide"); return; }
      var btn=bg.querySelector("#impGo"); btn.disabled=true; btn.textContent="Reading…";
      var reader=new FileReader();
      reader.onload=async function(){
        btn.textContent="Importing…";
        var res=await API.call("o2o_import",{
          company_id:ACTIVE.id,
          year:parseInt(bg.querySelector("#i_year").value,10),
          month:parseInt(bg.querySelector("#i_month").value,10),
          csv:String(reader.result), source_name:f.name,
        });
        btn.disabled=false; btn.textContent="Import";
        if(!res.ok){
          m.innerHTML=esc(res.error)+(res.headers?'<br><span style="font-size:12px">Columns found: '+esc(res.headers.join(", "))+"</span>":"");
          m.classList.remove("hide"); return;
        }
        bg.remove();
        toast("Imported "+res.imported+" line"+(res.imported===1?"":"s")+
              (res.rejected_count?" · "+res.rejected_count+" rejected":""));
        O2O_BATCH=res.batch_id; render();
      };
      reader.onerror=function(){ btn.disabled=false; btn.textContent="Import";
        m.textContent="Could not read that file."; m.classList.remove("hide"); };
      reader.readAsText(f);
    };
  }

  async function renderO2OBatch(v, batchId){
    v.innerHTML='<button class="link" id="backBtn">← All imports</button>'+
      '<div id="bBody" style="margin-top:12px"><p class="empty">Loading…</p></div>';
    $("backBtn").onclick=function(){ O2O_BATCH=null; render(); };

    var res=await API.call("o2o_batch_get",{ company_id:ACTIVE.id, batch_id:batchId });
    var box=$("bBody");
    if(!res.ok){ box.innerHTML='<p class="empty">'+esc(AUTH.friendlyError(res.error))+"</p>"; return; }

    var t=res.totals, b=res.batch;
    var html='<div class="row" style="margin-bottom:14px"><div class="grow">'+
      "<h2>"+esc(MONTHS[b.period_month-1])+" "+esc(b.period_year)+"</h2>"+
      '<p class="sub" style="margin:0">'+esc(b.source_name||"imported file")+"</p></div>"+
      (b.status==="issued"?'<span class="pill good">issued</span>':"")+"</div>";

    html+='<div class="tiles">'+
      tile("Pharmacies", String(t.pharmacies), "one invoice each")+
      tile("Sales lines", String(t.lines), "")+
      tile("Batch value", rm0(t.total_sen), "before tax", true)+
      tile("Needs a contact", String(t.unlinked), t.unlinked? "cannot invoice until linked":"all linked")+
      tile("Already issued", String(t.already_issued), "in Xero")+
      "</div>";

    if(t.unlinked){
      html+='<div class="msg warn"><strong>'+t.unlinked+' pharmac'+(t.unlinked===1?"y":"ies")+
        " not yet matched to a Xero contact.</strong> They are skipped when issuing — an invoice "+
        "raised against the wrong customer is a real bill to a real company, so this step is manual."+
        '<div style="margin-top:10px"><button class="btn btn-sm" id="resolveBtn">Match to Xero contacts</button></div></div>';
    }

    html+='<div class="row" style="margin:16px 0 10px">'+
      (b.status!=="issued"
        ? '<button class="btn btn-sm btn-ghost" id="dryBtn">Preview invoices</button>'+
          '<button class="btn btn-sm" id="issueBtn">Issue '+(t.pharmacies-t.unlinked-t.already_issued)+' invoice(s) in Xero</button>'
        : "")+
      '<span class="grow"></span>'+
      (b.status!=="issued"&&!t.already_issued?'<button class="btn btn-sm btn-ghost" id="delBtn">Delete import</button>':"")+
      "</div>";

    html+='<div class="tbl-wrap"><table><thead><tr><th>Pharmacy</th><th>Xero contact</th>'+
      '<th class="num">Lines</th><th class="num">Amount</th><th>Status</th></tr></thead><tbody>'+
      res.groups.map(function(g){
        var contact = g.xero_contact_name
          ? esc(g.xero_contact_name)+(g.match_method==="fuzzy_auto"?' <span class="pill mute">auto '+(g.match_score||"")+"</span>":"")
          : '<span style="color:var(--bad)">not matched</span>';
        var st = g.issued && g.issued.status==="issued"
          ? '<span class="pill good">'+esc(g.issued.xero_invoice_number||"issued")+"</span>"
          : g.issued && g.issued.status==="failed"
          ? '<span class="pill bad" title="'+esc(g.issued.error||"")+'">failed</span>'
          : g.xero_contact_id ? '<span class="pill warn">ready</span>' : '<span class="pill mute">blocked</span>';
        return "<tr><td class='name'>"+esc(g.pharmacy_name)+"</td><td>"+contact+"</td>"+
          "<td class='num'>"+g.lines.length+"</td><td class='num'>"+rm(g.total_sen)+"</td>"+
          "<td>"+st+"</td></tr>";
      }).join("")+
      "</tbody><tfoot><tr><td colspan='2'>Total</td><td class='num'>"+t.lines+"</td>"+
      "<td class='num'>"+rm(t.total_sen)+"</td><td></td></tr></tfoot></table></div>";

    box.innerHTML=html;

    var rb=$("resolveBtn");
    if(rb) rb.onclick=async function(){
      rb.disabled=true; rb.textContent="Reading Xero contacts…";
      var r=await API.call("o2o_resolve_contacts",{ company_id:ACTIVE.id, batch_id:batchId });
      rb.disabled=false; rb.textContent="Match to Xero contacts";
      if(!r.ok) return alert(r.error);
      matchModal(r, batchId);
    };
    var db=$("dryBtn");
    if(db) db.onclick=async function(){
      db.disabled=true; db.textContent="Building preview…";
      var r=await API.call("o2o_issue",{ company_id:ACTIVE.id, batch_id:batchId, dry_run:true });
      db.disabled=false; db.textContent="Preview invoices";
      if(!r.ok) return alert(r.error);
      previewModal(r);
    };
    var ib=$("issueBtn");
    if(ib) ib.onclick=function(){ confirmIssue(batchId, t); };
    var xb=$("delBtn");
    if(xb) xb.onclick=async function(){
      if(!confirm("Delete this import? Nothing has been sent to Xero, so this only removes the imported rows.")) return;
      var r=await API.call("o2o_batch_delete",{ company_id:ACTIVE.id, batch_id:batchId });
      if(!r.ok) return alert(r.error);
      toast("Import deleted"); O2O_BATCH=null; render();
    };
  }

  function matchModal(r, batchId){
    var needs=r.pharmacies.filter(function(p){ return p.state==="needs_review"; });
    var options=r.contact_options.map(function(c){
      return '<option value="'+esc(c.id)+'|'+esc(c.name)+'">'+esc(c.name)+"</option>"; }).join("");
    var bg=document.createElement("div"); bg.className="modal-bg";
    bg.innerHTML='<div class="modal"><h3>Match pharmacies to Xero contacts</h3>'+
      '<p class="sub">'+r.contacts_scanned+" contacts read from Xero. "+
      (r.pharmacies.length-needs.length)+" already matched. Confirm each remaining one — "+
      "a suggestion is only a suggestion.</p>"+
      (needs.length? needs.map(function(p){
        return '<div style="padding:10px 0;border-bottom:1px solid var(--rule-soft)" data-p="'+esc(p.id)+'">'+
          "<strong>"+esc(p.name)+"</strong>"+
          (p.suggestion?'<div class="fld-note">closest: '+esc(p.suggestion.contact_name)+" ("+p.suggestion.score+")</div>":
                        '<div class="fld-note">no close match found</div>')+
          '<select class="pmatch" style="margin-top:6px"><option value="">Choose a Xero contact…</option>'+options+"</select></div>";
      }).join("") : '<p class="empty">Everything is matched.</p>')+
      '<div class="modal-actions"><button class="btn btn-sm btn-ghost" id="mCancel">Close</button>'+
      (needs.length?'<button class="btn btn-sm" id="mSave">Save matches</button>':"")+"</div></div>";
    document.body.appendChild(bg);
    bg.addEventListener("click",function(ev){ if(ev.target===bg) bg.remove(); });
    // Pre-select each suggestion so a correct one is one click, but never pre-saved.
    needs.forEach(function(p){
      if(!p.suggestion) return;
      var row=bg.querySelector('[data-p="'+p.id+'"] select');
      if(row) row.value=p.suggestion.contact_id+"|"+p.suggestion.contact_name;
    });
    bg.querySelector("#mCancel").onclick=function(){ bg.remove(); renderO2OBatch($("view"),batchId); };
    var ms=bg.querySelector("#mSave");
    if(ms) ms.onclick=async function(){
      ms.disabled=true; ms.textContent="Saving…";
      var rows=[].slice.call(bg.querySelectorAll("[data-p]"));
      for(var i=0;i<rows.length;i++){
        var sel=rows[i].querySelector("select");
        if(!sel.value) continue;
        var parts=sel.value.split("|");
        await API.call("o2o_link_pharmacy",{ company_id:ACTIVE.id, pharmacy_id:rows[i].dataset.p,
                                             contact_id:parts[0], contact_name:parts[1] });
      }
      bg.remove(); toast("Matches saved"); renderO2OBatch($("view"),batchId);
    };
  }

  // ═══════════ gateway fees ═══════════
  var GW_YEAR = new Date().getFullYear();
  var GATEWAYS = ["Atome","PayEx","Curlec","iPay88","ShopeePay","GrabPay","Boost","Billplz","Stripe","Razer","Other"];

  async function renderGateway(v){
    if (!ACTIVE) { v.innerHTML='<p class="empty">Select a company first.</p>'; return; }
    var years=[]; for(var y=new Date().getFullYear();y>=new Date().getFullYear()-3;y--) years.push(y);
    v.innerHTML=
      '<div class="row" style="margin-bottom:16px"><div class="grow">'+
      '<h2>Payment gateway fees</h2><p class="sub" style="margin:0">'+esc(ACTIVE.short_name)+
      ' — what each gateway actually costs, broken down by fee type.</p></div>'+
      '<select id="gwYear" style="width:auto">'+years.map(function(y){
        return '<option'+(y===GW_YEAR?" selected":"")+">"+y+"</option>"; }).join("")+"</select>"+
      '<button class="btn btn-sm" id="gwImport">Import settlement</button></div>'+
      '<div id="gwBody"><p class="empty">Loading…</p></div>';
    $("gwYear").onchange=function(e){ GW_YEAR=parseInt(e.target.value,10); loadGateway(); };

  async function loadGateway(){
    var box=$("gwBody"); if(!box) return;
    box.innerHTML='<p class="empty">Loading…</p>';
    var rep=await API.call("gateway_fee_report",{ company_id:ACTIVE.id, year:GW_YEAR });
    var list=await API.call("gateway_settlements_list",{ company_id:ACTIVE.id, year:GW_YEAR });
    if(!rep.ok){ box.innerHTML='<p class="empty">'+esc(AUTH.friendlyError(rep.error))+"</p>"; return; }

    if(!rep.gateways.length){
      box.innerHTML='<div class="panel"><p class="empty">No settlements imported for '+GW_YEAR+' yet. '+
        'Export a settlement report from any gateway and import it — the fee columns are matched automatically.</p></div>';
      return;
    }

    var t=rep.totals;
    var html='<div class="tiles">'+
      tile("Processed", rm0(t.gross_sen), "gross through gateways")+
      tile("Fees paid", rm0(t.fees_sen), "the real cost", true)+
      tile("Received", rm0(t.net_sen), "banked after fees")+
      tile("Blended rate", t.effective_rate_pct+"%", "across all gateways", true)+
      "</div>";

    // Fee cost by gateway, biggest first: the one to renegotiate is at the top.
    html+='<div class="panel"><h2 style="font-size:16px">Cost by gateway</h2>'+
      '<p class="sub">Effective rate includes flat fees and SST, not just the headline MDR — '+
      'two gateways quoting the same rate can cost quite differently.</p>'+
      '<div class="tbl-wrap" style="box-shadow:none"><table><thead><tr><th>Gateway</th>'+
      '<th class="num">Processed</th><th class="num">Fees</th><th class="num">Effective rate</th>'+
      '<th class="num">Txns</th><th class="num">Avg fee/txn</th></tr></thead><tbody>'+
      rep.gateways.map(function(g){
        var worst = g.effective_rate_pct === Math.max.apply(null, rep.gateways.map(function(x){return x.effective_rate_pct;}));
        return "<tr><td class='name'>"+esc(g.gateway)+"</td>"+
          "<td class='num'>"+rm(g.gross_sen)+"</td>"+
          "<td class='num'>"+rm(g.fees_sen)+"</td>"+
          "<td class='num'"+(worst?" style='color:var(--bad);font-weight:700'":"")+">"+g.effective_rate_pct+"%</td>"+
          "<td class='num'>"+g.txns+"</td><td class='num'>"+rm(g.avg_fee_per_txn_sen)+"</td></tr>";
      }).join("")+
      "</tbody><tfoot><tr><td>All gateways</td><td class='num'>"+rm(t.gross_sen)+"</td>"+
      "<td class='num'>"+rm(t.fees_sen)+"</td><td class='num'>"+t.effective_rate_pct+"%</td>"+
      "<td class='num'>"+rep.gateways.reduce(function(s,g){return s+g.txns;},0)+"</td><td></td></tr></tfoot></table></div></div>";

    // The component breakdown — the thing that did not exist anywhere before.
    html+='<div class="panel"><h2 style="font-size:16px">What the fees are made of</h2>'+
      '<p class="sub">Each component kept separate, so a gateway invoice can be checked line by line '+
      'rather than accepted as one number.</p>'+
      '<div class="tbl-wrap" style="box-shadow:none"><table><thead><tr><th>Gateway</th>'+
      '<th class="num">MDR</th><th class="num">MDR SST</th><th class="num">Flat</th>'+
      '<th class="num">Flat SST</th><th class="num">Refund</th><th class="num">Refund SST</th>'+
      '<th class="num">Rebate</th><th class="num">Net fees</th></tr></thead><tbody>'+
      rep.gateways.map(function(g){
        var c=g.components||{};
        var cell=function(x){ return "<td class='num'>"+(x?rm(x):"—")+"</td>"; };
        return "<tr><td class='name'>"+esc(g.gateway)+"</td>"+
          cell(c.mdr)+cell(c.mdr_sst)+cell(c.flat)+cell(c.flat_sst)+cell(c.refund)+cell(c.refund_sst)+
          "<td class='num'"+(c.rebate?" style='color:var(--good)'":"")+">"+(c.rebate?"−"+rm(c.rebate):"—")+"</td>"+
          "<td class='num'><strong>"+rm(g.fees_sen)+"</strong></td></tr>";
      }).join("")+"</tbody></table></div></div>";

    if(list.ok && list.settlements.length){
      html+='<h2 style="font-size:16px;margin:24px 0 4px">Imported settlements</h2>'+
        '<p class="sub">Every file imported for '+GW_YEAR+'.</p>'+
        '<div class="tbl-wrap"><table><thead><tr><th>Period</th><th>Gateway</th><th>File</th>'+
        '<th class="num">Gross</th><th class="num">Fees</th><th class="num">Net</th><th class="num">Rows</th><th></th></tr></thead><tbody>'+
        list.settlements.map(function(s){
          return "<tr><td>"+esc(MONTHS[s.period_month-1])+"</td><td class='name'>"+esc(s.gateway)+"</td>"+
            "<td>"+esc(s.source_name||"—")+"</td><td class='num'>"+rm(s.gross_sen)+"</td>"+
            "<td class='num'>"+rm(s.fees_total_sen)+"</td><td class='num'>"+rm(s.net_sen)+"</td>"+
            "<td class='num'>"+s.line_count+"</td>"+
            "<td><button class='link' data-s='"+esc(s.id)+"'>Delete</button></td></tr>";
        }).join("")+"</tbody></table></div>";
    }

    box.innerHTML=html;
    box.querySelectorAll("button.link[data-s]").forEach(function(btn){
      btn.onclick=async function(){
        if(!confirm("Delete this imported settlement? The gateway file itself is untouched.")) return;
        var r=await API.call("gateway_settlement_delete",{ company_id:ACTIVE.id, settlement_id:btn.dataset.s });
        if(!r.ok) return alert(r.error);
        toast("Deleted"); loadGateway();
      };
    });
  }

  function gwImportModal(){
    var now=new Date();
    var years=[]; for(var y=now.getFullYear();y>=now.getFullYear()-3;y--) years.push(y);
    var bg=document.createElement("div"); bg.className="modal-bg";
    bg.innerHTML='<div class="modal" style="max-width:540px"><h3>Import a gateway settlement</h3>'+
      '<div id="gwMsg" class="msg err hide"></div>'+
      '<p class="sub">The settlement or transaction report from the gateway, as CSV. Fee columns '+
      '(MDR, SST, flat, refund, rebate) are matched by name — anything it cannot account for is reported.</p>'+
      '<div class="fields">'+
        '<div><label>Gateway</label><select id="g_gw">'+GATEWAYS.map(function(x){
          return "<option>"+x+"</option>"; }).join("")+"</select></div>"+
        '<div><label>Month</label><select id="g_month">'+MONTHS.map(function(m,i){
          return '<option value="'+(i+1)+'"'+(i+1===now.getMonth()+1?" selected":"")+">"+m+"</option>"; }).join("")+"</select></div>"+
        '<div><label>Year</label><select id="g_year">'+years.map(function(y){
          return '<option'+(y===now.getFullYear()?" selected":"")+">"+y+"</option>"; }).join("")+"</select></div>"+
        '<div class="full"><label>CSV file</label><input type="file" id="g_file" accept=".csv,text/csv"></div>'+
      "</div>"+
      '<div class="modal-actions"><button class="btn btn-sm btn-ghost" id="gCancel">Cancel</button>'+
      '<button class="btn btn-sm" id="gGo">Import</button></div></div>';
    document.body.appendChild(bg);
    bg.addEventListener("click",function(ev){ if(ev.target===bg) bg.remove(); });
    bg.querySelector("#gCancel").onclick=function(){ bg.remove(); };
    bg.querySelector("#gGo").onclick=function(){
      var f=bg.querySelector("#g_file").files[0];
      var m=bg.querySelector("#gwMsg");
      if(!f){ m.textContent="Choose a CSV file first."; m.classList.remove("hide"); return; }
      var btn=bg.querySelector("#gGo"); btn.disabled=true; btn.textContent="Reading…";
      var reader=new FileReader();
      reader.onload=async function(){
        btn.textContent="Importing…";
        var res=await API.call("gateway_import",{
          company_id:ACTIVE.id, gateway:bg.querySelector("#g_gw").value,
          year:parseInt(bg.querySelector("#g_year").value,10),
          month:parseInt(bg.querySelector("#g_month").value,10),
          csv:String(reader.result), source_name:f.name,
        });
        btn.disabled=false; btn.textContent="Import";
        if(!res.ok){
          m.innerHTML=esc(res.error)+(res.headers?'<br><span style="font-size:12px">Columns found: '+esc(res.headers.join(", "))+"</span>":"");
          m.classList.remove("hide"); return;
        }
        bg.remove();
        gwResultModal(res);
        GW_YEAR=parseInt(bg.querySelector("#g_year")?bg.querySelector("#g_year").value:GW_YEAR,10)||GW_YEAR;
        loadGateway();
      };
      reader.onerror=function(){ btn.disabled=false; btn.textContent="Import";
        m.textContent="Could not read that file."; m.classList.remove("hide"); };
      reader.readAsText(f);
    };
  }

        tile("Net", rm0(res.net_sen), "")+

      (res.warnings && res.warnings.length
        ? '<div class="msg warn">'+res.warnings.map(esc).join("<br><br>")+"</div>" : "")+

  // ═══════════ supplier invoices (AP) ═══════════
  var AP_DOC = null, AP_FILTER = "needs_review";

  async function renderAP(v){
    if (AP_DOC) return renderAPDoc(v, AP_DOC);
    var filters=[["needs_review","Needs review"],["ready_to_post","Ready to post"],
                 ["posted","Posted"],["duplicate","Duplicates"],["rejected","Rejected"],["","All"]];
    v.innerHTML=
      '<div class="row" style="margin-bottom:16px"><div class="grow">'+
      '<h2>Supplier invoices</h2><p class="sub" style="margin:0">'+
      'Every bill stops here for a person. Nothing is ever approved for payment automatically.</p></div>'+
      '<button class="btn btn-sm" id="apAdd">Add invoice</button></div>'+
      '<div class="row" style="margin-bottom:14px">'+filters.map(function(f){
        return '<button class="btn btn-sm '+(AP_FILTER===f[0]?"":"btn-ghost")+'" data-f="'+f[0]+'">'+f[1]+"</button>";
      }).join("")+"</div>"+
      '<div id="apList"><p class="empty">Loading…</p></div>';
    $("apAdd").onclick=apAddModal;
    v.querySelectorAll("button[data-f]").forEach(function(b){
      b.onclick=function(){ AP_FILTER=b.dataset.f; render(); };
    });

    var params={}; if(ACTIVE) params.company_id=ACTIVE.id;
    if(AP_FILTER) params.decision=AP_FILTER;
    var res=await API.call("ap_list", params);
    var box=$("apList");
    if(!res.ok){ box.innerHTML='<p class="empty">'+esc(AUTH.friendlyError(res.error))+"</p>"; return; }
    if(!res.documents.length){
      box.innerHTML='<div class="panel"><p class="empty">Nothing here. Add a supplier invoice to start.</p></div>'; return;
    }
    box.innerHTML='<div class="tbl-wrap"><table><thead><tr><th>Supplier</th><th>Invoice</th>'+
      '<th>Date</th><th class="num">Total</th><th>State</th><th></th></tr></thead><tbody>'+
      res.documents.map(function(d){
        var blockers=(d.decision_reasons||[]).filter(function(r){return r.severity==="block";});
        return "<tr><td class='name'>"+esc(d.vendor_name||"—")+
          (d.file_name?'<div style="font-size:11px;color:var(--ink-faint);font-weight:400">'+esc(d.file_name)+"</div>":"")+"</td>"+
          "<td class='mono'>"+esc(d.invoice_number||"—")+"</td>"+
          "<td>"+esc(d.invoice_date||"—")+"</td>"+
          "<td class='num'>"+(d.total_sen!=null?rm(d.total_sen):"—")+"</td>"+
          "<td>"+apPill(d.decision, blockers.length)+"</td>"+
          "<td><button class='link' data-d='"+esc(d.id)+"'>Open</button></td></tr>";
      }).join("")+"</tbody></table></div>";
    box.querySelectorAll("button.link").forEach(function(b){
      b.onclick=function(){ AP_DOC=b.dataset.d; render(); };
    });
  }

  function apPill(decision, blockerCount){
    if(decision==="posted")        return '<span class="pill good">in Xero</span>';
    if(decision==="ready_to_post") return '<span class="pill warn">ready</span>';
    if(decision==="duplicate")     return '<span class="pill mute">duplicate</span>';
    if(decision==="rejected")      return '<span class="pill mute">rejected</span>';
    if(decision==="company_unknown") return '<span class="pill bad">no company</span>';
    return '<span class="pill bad">'+(blockerCount||0)+" to fix</span>";
  }

  async function renderAPDoc(v, docId){
    v.innerHTML='<button class="link" id="apBack">← All supplier invoices</button>'+
      '<div id="apBody" style="margin-top:12px"><p class="empty">Loading…</p></div>';
    $("apBack").onclick=function(){ AP_DOC=null; render(); };

    var res=await API.call("ap_get",{ document_id:docId });
    var box=$("apBody");
    if(!res.ok){ box.innerHTML='<p class="empty">'+esc(AUTH.friendlyError(res.error))+"</p>"; return; }
    var d=res.document, lines=res.lines;
    var blockers=(d.decision_reasons||[]).filter(function(r){return r.severity==="block";});
    var warns=(d.decision_reasons||[]).filter(function(r){return r.severity==="warn";});

    var html='<div class="row" style="margin-bottom:14px"><div class="grow">'+
      "<h2>"+esc(d.vendor_name||"Unknown supplier")+"</h2>"+
      '<p class="sub" style="margin:0">'+esc(d.invoice_number||"no invoice number")+
      (d.file_name?" · "+esc(d.file_name):"")+"</p></div>"+apPill(d.decision,blockers.length)+"</div>";

    if(d.decision==="posted"){
      html+='<div class="msg ok"><strong>In Xero as '+esc(d.xero_invoice_number||"a bill")+'.</strong> '+
        'It was created awaiting approval — it is not approved for payment until someone approves it in Xero.</div>';
    }

    // Blockers first and in plain words: this is the whole point of the screen.
    if(blockers.length){
      html+='<div class="msg err"><strong>Cannot post until these are resolved:</strong>'+
        '<ul style="margin:8px 0 0;padding-left:20px">'+
        blockers.map(function(r){ return "<li>"+esc(r.detail)+"</li>"; }).join("")+"</ul></div>";
    }
    if(warns.length){
      html+='<div class="msg warn"><strong>Worth checking:</strong>'+
        '<ul style="margin:8px 0 0;padding-left:20px">'+
        warns.map(function(r){ return "<li>"+esc(r.detail)+"</li>"; }).join("")+"</ul></div>";
    }

    html+='<div class="panel"><div class="fields">'+
      apField("Supplier","f_vendor",d.vendor_name)+
      apField("Invoice number","f_invno",d.invoice_number)+
      apField("Invoice date","f_invdate",d.invoice_date,"date")+
      apField("Due date","f_due",d.due_date,"date")+
      apField("Subtotal (RM)","f_sub",d.subtotal_sen!=null?(d.subtotal_sen/100).toFixed(2):"")+
      apField("Tax (RM)","f_tax",d.tax_sen!=null?(d.tax_sen/100).toFixed(2):"")+
      apField("Total (RM)","f_total",d.total_sen!=null?(d.total_sen/100).toFixed(2):"")+
      '<div><label>Company</label><select id="f_company">'+
        '<option value="">Not chosen</option>'+
        COMPANIES.map(function(c){
          return '<option value="'+esc(c.id)+'"'+(d.company_id===c.id?" selected":"")+">"+esc(c.short_name)+"</option>";
        }).join("")+"</select></div>"+
      "</div></div>";

    html+='<h2 style="font-size:16px;margin:20px 0 4px">Lines</h2>'+
      '<p class="sub">Each line needs an account code. Where one was chosen for you, the reason is shown.</p>'+
      '<div class="tbl-wrap"><table><thead><tr><th>Description</th><th class="num">Amount</th>'+
      '<th>Account</th><th>Why</th></tr></thead><tbody>'+
      lines.map(function(l){
        return "<tr data-line='"+l.line_no+"'>"+
          "<td class='name'>"+esc(l.description||"—")+"</td>"+
          "<td class='num'>"+rm(l.amount_sen)+"</td>"+
          "<td><input class='ap-acct mono' style='width:110px;padding:5px 8px' value='"+esc(l.account_code||"")+"'></td>"+
          "<td style='font-size:12px;color:var(--ink-faint)'>"+esc(l.coding_note||"")+"</td></tr>";
      }).join("")+
      "</tbody><tfoot><tr><td>Lines total</td><td class='num'>"+
      rm(lines.reduce(function(s,l){return s+Number(l.amount_sen);},0))+"</td><td colspan='2'></td></tr></tfoot></table></div>";

    if(d.decision!=="posted"){
      html+='<div class="row" style="margin-top:16px">'+
        '<button class="btn btn-sm btn-ghost" id="apSave">Save changes</button>'+
        (d.decision==="ready_to_post"?'<button class="btn btn-sm" id="apPreview">Preview the Xero bill</button>'+
          '<button class="btn btn-sm" id="apPost">Post to Xero</button>':"")+
        '<span class="grow"></span>'+
        '<button class="btn btn-sm btn-danger" id="apRejectBtn">Reject</button></div>';
    }

    box.innerHTML=html;

    var sv=$("apSave");
    if(sv) sv.onclick=async function(){
      sv.disabled=true; sv.textContent="Saving…";
      var payload={ document_id:docId,
        vendor_name:$("f_vendor").value.trim(),
        invoice_number:$("f_invno").value.trim(),
        invoice_date:$("f_invdate").value||null,
        due_date:$("f_due").value||null,
        subtotal_sen:senFromInput($("f_sub").value),
        tax_sen:senFromInput($("f_tax").value),
        total_sen:senFromInput($("f_total").value),
        lines:[].slice.call(box.querySelectorAll("tr[data-line]")).map(function(tr){
          return { line_no:parseInt(tr.dataset.line,10), account_code:tr.querySelector(".ap-acct").value.trim() };
        }),
      };
      var comp=$("f_company").value; if(comp) payload.company_id=comp;
      var r=await API.call("ap_update",payload);
      sv.disabled=false; sv.textContent="Save changes";
      if(!r.ok) return alert(r.error);
      toast(r.decision==="ready_to_post"?"Saved — ready to post":"Saved");
      renderAPDoc($("view"),docId);
    };

    var pv=$("apPreview");
    if(pv) pv.onclick=async function(){
      var r=await API.call("ap_post_preview",{ document_id:docId });
      if(!r.ok) return alert(r.error);
      apPreviewModal(r);
    };

    var pb=$("apPost");
    if(pb) pb.onclick=function(){ apConfirmPost(docId, d); };

    var rj=$("apRejectBtn");
    if(rj) rj.onclick=async function(){
      var why=prompt("Why is this being rejected? (kept on the record)");
      if(why===null) return;
      var r=await API.call("ap_reject",{ document_id:docId, reason:why });
      if(!r.ok) return alert(r.error);
      toast("Rejected"); AP_DOC=null; render();
    };
  }

  function apField(label,id,value,type){
    return '<div><label>'+esc(label)+'</label><input id="'+id+'" type="'+(type||"text")+'" value="'+esc(value==null?"":value)+'"></div>';
  }

      '<div class="panel" style="margin-bottom:12px"><div class="row"><span class="grow">Supplier</span><strong>'+esc(p.Contact.Name)+"</strong></div>"+
      '<div class="row"><span class="grow">Invoice number</span><strong class="mono">'+esc(p.InvoiceNumber||"—")+"</strong></div>"+
      '<div class="row"><span class="grow">Date / due</span><strong>'+esc(p.Date)+" → "+esc(p.DueDate)+"</strong></div>"+
      '<div class="row"><span class="grow">Currency</span><strong>'+esc(p.CurrencyCode)+"</strong></div></div>"+
      '<div class="tbl-wrap" style="box-shadow:none"><table><thead><tr><th>Description</th>'+
      '<th class="num">Qty</th><th class="num">Unit</th><th>Account</th></tr></thead><tbody>'+
      p.LineItems.map(function(li){
        return "<tr><td>"+esc(li.Description)+"</td><td class='num'>"+li.Quantity+"</td>"+
          "<td class='num'>"+li.UnitAmount.toFixed(2)+"</td><td class='mono'>"+esc(li.AccountCode||"—")+"</td></tr>";
      }).join("")+"</tbody></table></div>"+
      (r.warnings&&r.warnings.length?'<div class="msg warn" style="margin-top:12px">'+
        r.warnings.map(function(w){return esc(w.detail);}).join("<br>")+"</div>":"")+
      '<div class="modal-actions"><button class="btn btn-sm" id="apPvClose">Close</button></div></div>';
    document.body.appendChild(bg);
    bg.addEventListener("click",function(ev){ if(ev.target===bg) bg.remove(); });
    bg.querySelector("#apPvClose").onclick=function(){ bg.remove(); };
  }

  function apConfirmPost(docId, d){
    var bg=document.createElement("div"); bg.className="modal-bg";
    bg.innerHTML='<div class="modal" style="max-width:460px"><h3>Post this bill to Xero?</h3>'+
      '<div class="panel" style="margin:0 0 12px"><div class="row"><span class="grow">Supplier</span><strong>'+esc(d.vendor_name)+"</strong></div>"+
      '<div class="row"><span class="grow">Invoice</span><strong class="mono">'+esc(d.invoice_number)+"</strong></div>"+
      '<div class="row"><span class="grow">Total</span><strong>'+rm(d.total_sen)+"</strong></div></div>"+
      '<p class="sub">It will be created <strong>awaiting approval</strong> — visible in Xero as a bill, '+
      "but not approved for payment. Someone still has to approve it there before any money moves.</p>"+
      '<div id="apPostMsg" class="msg err hide"></div>'+
      '<div class="modal-actions"><button class="btn btn-sm btn-ghost" id="apPcancel">Cancel</button>'+
      '<button class="btn btn-sm" id="apPgo">Post to Xero</button></div></div>';
    document.body.appendChild(bg);
    bg.addEventListener("click",function(ev){ if(ev.target===bg) bg.remove(); });
    bg.querySelector("#apPcancel").onclick=function(){ bg.remove(); };
    bg.querySelector("#apPgo").onclick=async function(){
      var btn=bg.querySelector("#apPgo"); btn.disabled=true; btn.textContent="Posting…";
      var r=await API.call("ap_post",{ document_id:docId });
      btn.disabled=false; btn.textContent="Post to Xero";
      if(!r.ok){ var m=bg.querySelector("#apPostMsg"); m.textContent=r.error; m.classList.remove("hide"); return; }
      bg.remove(); toast("Posted as "+(r.xero_invoice_number||"a bill")+" — awaiting approval in Xero");
      renderAPDoc($("view"),docId);
    };
  }

  // Manual entry. Extraction from a PDF is a later step; this exists so the review and
  // posting path is usable and provable today rather than blocked behind it.
  function apAddModal(){
    var bg=document.createElement("div"); bg.className="modal-bg";
    bg.innerHTML='<div class="modal"><h3>Add a supplier invoice</h3>'+
      '<div id="apAddMsg" class="msg err hide"></div>'+
      '<div class="fields">'+
        '<div><label>Company</label><select id="a_company">'+COMPANIES.map(function(c){
          return '<option value="'+esc(c.id)+'"'+(ACTIVE&&c.id===ACTIVE.id?" selected":"")+">"+esc(c.short_name)+"</option>";
        }).join("")+"</select></div>"+
        '<div><label>Supplier</label><input id="a_vendor"></div>'+
        '<div><label>Invoice number</label><input id="a_invno"></div>'+
        '<div><label>Invoice date</label><input id="a_date" type="date"></div>'+
        '<div><label>Due date</label><input id="a_due" type="date"></div>'+
        '<div><label>Subtotal (RM)</label><input id="a_sub" class="mono" inputmode="decimal"></div>'+
        '<div><label>Tax (RM)</label><input id="a_tax" class="mono" inputmode="decimal"></div>'+
        '<div><label>Total (RM)</label><input id="a_total" class="mono" inputmode="decimal"></div>'+
        '<div class="full"><label>Description</label><input id="a_desc" placeholder="what this bill is for"></div>'+
        '<div><label>Account code</label><input id="a_acct" class="mono" placeholder="e.g. 400"></div>'+
      "</div>"+
      '<div class="modal-actions"><button class="btn btn-sm btn-ghost" id="aCancel">Cancel</button>'+
      '<button class="btn btn-sm" id="aGo">Add</button></div></div>';
    document.body.appendChild(bg);
    bg.addEventListener("click",function(ev){ if(ev.target===bg) bg.remove(); });
    bg.querySelector("#aCancel").onclick=function(){ bg.remove(); };
    bg.querySelector("#aGo").onclick=async function(){
      var btn=bg.querySelector("#aGo"); btn.disabled=true; btn.textContent="Adding…";
      var total=senFromInput(bg.querySelector("#a_total").value);
      var sub=senFromInput(bg.querySelector("#a_sub").value);
      var res=await API.call("ap_intake",{
        company_id: bg.querySelector("#a_company").value || null,
        file_name: "entered by hand",
        extraction:{
          vendor_name: bg.querySelector("#a_vendor").value.trim(),
          invoice_number: bg.querySelector("#a_invno").value.trim(),
          invoice_date: bg.querySelector("#a_date").value||null,
          due_date: bg.querySelector("#a_due").value||null,
          currency:"MYR",
          subtotal_sen: sub||null,
          tax_sen: senFromInput(bg.querySelector("#a_tax").value)||null,
          total_sen: total||null,
          document_type:"invoice",
          lines:[{ description: bg.querySelector("#a_desc").value.trim()||"Supplier charge",
                   quantity:1, amount_sen: sub||total,
                   account_code: bg.querySelector("#a_acct").value.trim()||null }],
        },
        extraction_model:"manual", confidence:"high",
      });
      btn.disabled=false; btn.textContent="Add";
      if(!res.ok){ var m=bg.querySelector("#apAddMsg"); m.textContent=res.error; m.classList.remove("hide"); return; }
      bg.remove();
      toast(res.decision==="ready_to_post"?"Added — ready to post":"Added — needs review");
      AP_DOC=res.document_id; AP_FILTER=""; render();
    };
  }

  // ═══════════ settings ═══════════
  async function renderSettings(v){
    v.innerHTML='<h2>Settings</h2><p class="sub">Companies and the Xero connection.</p>'+
      '<div id="setCompanies"></div>'+
      (canManageUsers()?'<h2 style="margin-top:28px">Xero connection</h2>'+
        '<p class="sub">One Xero grant covers every company. Each organisation is linked by hand — a wrong link posts invoices into the wrong entity\'s books.</p>'+
        '<div class="panel" id="xeroPanel"><p class="empty">Loading…</p></div>':"");

    const res = await API.call("companies_list");
    $("setCompanies").innerHTML = (res.ok?res.companies:[]).map((c)=>
      '<div class="co" style="margin-bottom:10px"><div class="cn">'+esc(c.short_name)+"</div>"+
      '<div class="cl">'+esc(c.legal_name)+(c.registration_no?" · "+esc(c.registration_no):"")+"</div>"+
      (c.xero_tenant_id?'<span class="pill good"><span class="dot"></span>Xero connected</span>'
                       :'<span class="pill warn"><span class="dot"></span>Not connected</span>')+
      "</div>").join("");

    if (canManageUsers()) renderXero();
  }

  async function renderXero(){
    const panel=$("xeroPanel"); if(!panel) return;
    const res=await API.call("xero_status");
    if(!res.ok){ panel.innerHTML='<p class="empty">'+esc(AUTH.friendlyError(res.error))+"</p>"; return; }

    const connectBtn=(label)=>'<button class="btn btn-sm" id="connectBtn">'+label+"</button>";
    const wireConnect=()=>{
      const b=$("connectBtn"); if(!b) return;
      b.onclick=async ()=>{
        const r=await API.call("xero_connect_url");
        if(!r.ok) return alert("Can't start the Xero connection: "+r.error);
        window.open(r.url,"_blank","noopener");
      };
    };

    if(!res.connected){
      panel.innerHTML='<p class="sub">No Xero organisation is connected yet.</p>'+connectBtn("Connect Xero");
      return wireConnect();
    }

    const unlinked=res.unlinked_orgs||[];
    const awaiting=(res.companies||[]).filter((c)=>!c.xero_tenant_id);
    const options=(res.companies||[]).filter((c)=>!c.xero_tenant_id)
      .map((c)=>'<option value="'+esc(c.id)+'">'+esc(c.short_name)+"</option>").join("");

    let html='<p class="sub">Connected'+(res.connected_at?" on "+esc(fmtDate(res.connected_at)):"")+". "+
      (res.orgs||[]).length+" organisation"+((res.orgs||[]).length===1?"":"s")+" visible.</p>";

    if(!unlinked.length) html+='<p class="empty">Every visible organisation is linked to a company.</p>';
    else html+=unlinked.map((o)=>{
      const pre=o.suggested?o.suggested.company_id:"";
      const opts=options.replace('value="'+esc(pre)+'"','value="'+esc(pre)+'" selected');
      return '<div class="row" data-tenant="'+esc(o.tenant_id)+'" style="padding:10px 0;border-bottom:1px solid var(--rule-soft)">'+
        '<span class="grow"><strong>'+esc(o.tenant_name)+"</strong></span>"+
        (o.suggested?'<span class="pill mute">suggested: '+esc(o.suggested.short_name)+"</span>":'<span class="pill mute">no confident match</span>')+
        '<select class="co-select" style="width:auto"><option value="">Choose company…</option>'+opts+"</select>"+
        '<button class="btn btn-sm link-btn">Link</button></div>';
    }).join("");

    html+='<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--rule-soft)">'+
      (awaiting.length
        ? '<p class="sub">Still without a Xero organisation: '+awaiting.map((c)=>esc(c.short_name)).join(", ")+
          ". Xero grants one organisation per authorisation, so run this once more for each.</p>"
        : '<p class="sub">Every company has a Xero organisation linked.</p>')+
      connectBtn("Connect another organisation")+"</div>";

    panel.innerHTML=html;
    wireConnect();
    panel.querySelectorAll(".link-btn").forEach((btn)=>{
      btn.onclick=async ()=>{
        const row=btn.closest(".row");
        const companyId=row.querySelector(".co-select").value;
        if(!companyId) return alert("Choose which company this organisation belongs to.");
        btn.disabled=true; btn.textContent="Linking…";
        const r=await API.call("xero_link_company",{ company_id:companyId, tenant_id:row.dataset.tenant });
        if(!r.ok){ btn.disabled=false; btn.textContent="Link"; return alert("Couldn't link: "+r.error); }
        toast("Linked"); await enterApp();
      };
    });
  }

  function fmtDate(iso){
    try { return new Date(iso).toLocaleDateString("en-MY",{day:"numeric",month:"short",year:"numeric"}); }
    catch(_e){ return iso; }
  }

  // ═══════════ boot ═══════════
  (async function(){
    const user = API.getToken() ? await AUTH.currentUser() : null;
    if (user) return enterApp();
    const status = await API.call("setup_status",{ token:undefined });
    if (status && status.ok && status.needs_setup){
      $("pwForm").classList.add("hide"); $("setupForm").classList.remove("hide");
      $("signinTitle").textContent="Set up the portal";
      $("app").classList.add("hide"); $("signin").classList.remove("hide");
      return;
    }
    showSignIn();
  })();
})();
</script>
